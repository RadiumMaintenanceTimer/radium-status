<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radium Server Status</title>
  <style>
    body {
      background-color: #121214;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: #1e1e24;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #2d2d38;
      max-width: 450px;
      width: 100%;
      text-align: center;
    }

    /* Image Display Area */
    .image-preview {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      background-color: #141418;
      display: none; /* Hidden until valid Base64 is entered */
    }

    /* Input Field */
    .input-group {
      margin-bottom: 1.5rem;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3d3d4e;
      background: #141418;
      color: #fff;
      font-size: 0.85rem;
      box-sizing: border-box;
      resize: vertical;
      font-family: monospace;
    }

    /* Count-Up Timer */
    .timer {
      display: flex;
      justify-content: space-between;
      background: #141418;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #262630;
    }

    .time-unit {
      display: flex;
      flex-direction: column;
    }

    .number {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff6b00;
    }

    .label {
      font-size: 0.7rem;
      color: #808090;
      text-transform: uppercase;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Displayed Image -->
    <img id="displayImage" class="image-preview" alt="Preview">

    <!-- Paste Raw Base64 Here -->
    <div class="input-group">
      <textarea 
        id="base64Input" 
        placeholder="Paste raw Base64 string here..." 
        oninput="updateImage()"
      ></textarea>
    </div>

    <!-- Count-Up Timer -->
    <div class="timer">
      <div class="time-unit">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="time-unit">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-unit">
        <span class="number" id="minutes">00</span>
        <span class="label">Mins</span>
      </div>
      <div class="time-unit">
        <span class="number" id="seconds">00</span>
        <span class="label">Secs</span>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. SET YOUR START DATE HERE (Year, Month [0-11], Day, Hour, Min)
    // Note: Months start at 0 (0 = Jan, 1 = Feb, etc.)
    // -------------------------------------------------------------
    const startDate = new Date(2024, 0, 1, 0, 0, 0); 

    // Raw Base64 Image Loader
    function updateImage() {
      const rawBase64 = document.getElementById('base64Input').value.trim();
      const imgElem = document.getElementById('displayImage');

      if (rawBase64) {
        // If user already included 'data:image/...', use it; otherwise prepend header
        if (rawBase64.startsWith('data:image')) {
          imgElem.src = rawBase64;
        } else {
          imgElem.src = `data:image/png;base64,${rawBase64}`;
        }
        imgElem.style.display = 'block';
      } else {
        imgElem.style.display = 'none';
      }
    }

    // Count-Up Timer Logic
    function updateCountUp() {
      const now = new Date();
      const diffInSeconds = Math.floor((now - startDate) / 1000);

      if (diffInSeconds < 0) return;

      const days = Math.floor(diffInSeconds / (3600 * 24));
      const hours = Math.floor((diffInSeconds % (3600 * 24)) / 3600);
      const minutes = Math.floor((diffInSeconds % 3600) / 60);
      const seconds = Math.floor(diffInSeconds % 60);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    // Start Timer
    setInterval(updateCountUp, 1000);
    updateCountUp();
  </script>

</body>
</html>
