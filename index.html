<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radium Server Status</title>
  <style>
    /* Dark Theme & Centered Layout */
    body {
      background-color: #121214;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .card {
      background: #1e1e24;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d2d38;
      max-width: 450px;
      width: 90%;
    }

    /* Orange accent styling for Rec Room vibes */
    .status-badge {
      display: inline-block;
      background-color: #ff6b00;
      color: #fff;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
    }

    p {
      color: #a0a0b0;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    /* Timer Display */
    .timer {
      display: flex;
      justify-content: space-around;
      background: #141418;
      padding: 1.2rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      border: 1px solid #262630;
    }

    .time-block {
      display: flex;
      flex-direction: column;
    }

    .number {
      font-size: 2rem;
      font-weight: bold;
      color: #ff6b00;
    }

    .label {
      font-size: 0.75rem;
      color: #707080;
      text-transform: uppercase;
    }

    /* Buttons */
    .btn {
      background-color: #2b2b36;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #ff6b00;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-badge">Maintenance Mode</div>
    <h1>Radium RR Status</h1>
    <p>Estimated time remaining until maintenance ends (maybe):</p>

    <!-- Timer Elements -->
    <div class="timer">
      <div class="time-block">
        <span class="number" id="days">99</span>
        <span class="label">Days</span>
      </div>
      <div class="time-block">
        <span class="number" id="hours">23</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-block">
        <span class="number" id="minutes">59</span>
        <span class="label">Mins</span>
      </div>
      <div class="time-block">
        <span class="number" id="seconds">59</span>
        <span class="label">Secs</span>
      </div>
    </div>

    <!-- Gag Button -->
    <button class="btn" onclick="addTime()">Check Server Status</button>
  </div>

  <script>
    // Set initial countdown (100 days out for the joke)
    let totalSeconds = 100 * 24 * 60 * 60;

    function updateTimer() {
      if (totalSeconds > 0) {
        totalSeconds--;
      }

      const d = Math.floor(totalSeconds / (3600 * 24));
      const h = Math.floor((totalSeconds % (3600 * 24)) / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);

      document.getElementById('days').innerText = String(d).padStart(2, '0');
      document.getElementById('hours').innerText = String(h).padStart(2, '0');
      document.getElementById('minutes').innerText = String(m).padStart(2, '0');
      document.getElementById('seconds').innerText = String(s).padStart(2, '0');
    }

    // Gag mechanic: Clicking "Check Status" ADDS time to the clock!
    function addTime() {
      totalSeconds += 7 * 24 * 3600; // Adds 7 days
      alert("Status updated: Maintenance extended by another week!");
      updateTimer();
    }

    // Run interval every second
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
