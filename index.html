<title>Is Radium Down?</title>
<meta name="description" content="Check if Radium (2023 Rec Room build) is down right now, see live uptime status, and check past downtime logs.">

<style>
html, body { 
  margin: 0; 
  padding: 0;
  width: 100%; 
  min-height: 100vh; 
  overflow-x: hidden; 
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
  background: linear-gradient(to bottom, #100F15, #1A1325); 
}

* { 
  box-sizing: border-box; 
}

:root {
  --base-scale: 3.5vmin;
}

.scale-wrapper {
  width: 100%;
  max-width: 600px;
  min-height: 100vh; 
  margin: 0 auto;
  padding: 3vmin 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.title, 
.timer, 
.discord, 
.footer { 
  background: linear-gradient(135deg, #61FE00, #019A43); 
  -webkit-background-clip: text; 
  background-clip: text; 
  -webkit-text-fill-color: transparent; 
  color: transparent; 
}

.logo { 
  display: flex;
  justify-content: center;
}

.logo img { 
  width: calc(var(--base-scale) * 7); 
  max-width: 150px;
  height: auto; 
}

.center-content {
  margin: auto 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateY(-3%); 
}

.title { 
  width: 90%; 
  text-align: center;
  line-height: 1.1; 
}

.small { 
  font-size: calc(var(--base-scale) * 1.2); 
  font-weight: 700; 
}

.large { 
  font-size: calc(var(--base-scale) * 2.8); 
  font-weight: 900; 
  letter-spacing: -1.5px; 
}

.medium { 
  font-size: calc(var(--base-scale) * 0.7); 
  font-weight: 800; 
}

.divider { 
  margin: calc(var(--base-scale) * 0.8) auto calc(var(--base-scale) * 1.5) auto;
  width: 80%;
  max-width: 550px;
  height: 2px;
  border-radius: 10px;
  background: linear-gradient(135deg, #61FE00, #019A43);
}

/* STATUS */

.status {
  transform: translateY(-8px); 
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:calc(var(--base-scale) * .8);
  font-size:calc(var(--base-scale) * .8);
  font-weight:700;
}

.status-light {
  width:12px;
  height:12px;
  border-radius:50%;
  animation:pulse 2s infinite ease-in-out;
}

.status-light.active {
  background:#ff3030;
  color:#ff3030;
}

.status-light.inactive {
  background:#61FE00;
  color:#61FE00;
}

.status-label {
  color:white;
}

@keyframes pulse {
  0% {
    opacity:.3;
    transform:scale(.9);
    box-shadow:0 0 4px currentColor;
  }

  50% {
    opacity:1;
    transform:scale(1.15);
    box-shadow:0 0 18px currentColor;
  }

  100% {
    opacity:.3;
    transform:scale(.9);
    box-shadow:0 0 4px currentColor;
  }
}

/* TIMER */

.timer { 
  width:95%;
  display:flex;
  justify-content:space-evenly; 
  gap:calc(var(--base-scale) * 1.2); 
  text-align:center;
}

.time-box {
  min-width:calc(var(--base-scale) * 2.5); 
}

.number { 
  font-size:calc(var(--base-scale) * 2.2); 
  font-weight:800; 
  line-height:1;
}

.label { 
  margin-top:4px;
  font-size:calc(var(--base-scale) * .6);
  font-weight:700;
}

/* BOTTOM */

.discord { 
  margin-bottom:calc(var(--base-scale) * .6);
  text-align:center;
  font-size:calc(var(--base-scale) * 1.3);
  font-weight:700;
}

.discord-logo { 
  width:calc(var(--base-scale) * 1.3);
  vertical-align:middle;
  margin-right:6px;
}

.footer { 
  width:90%;
  text-align:center;
  font-size:calc(var(--base-scale) * .45);
  font-weight:700;
  line-height:1.5;
}

.label, .small, .medium, .discord, .footer {
  text-shadow:0 0 1px rgba(97,254,0,.3);
}

@media (max-height:500px) and (orientation:landscape) {
  :root {
    --base-scale:4.5vh;
  }

  .center-content {
    transform:translateY(0);
  }
}

@media (min-width:800px) and (min-height:700px) {
  :root {
    --base-scale:24px;
  }
}

</style>

<script>

/* 
   CONFIGURATION
    */

const maintenanceActive = true;

const maintenanceStart = "2026-06-15T18:00:00-04:00";

/* 
   END CONFIGURATION
    */


const startTime = new Date(maintenanceStart);

function setTimer(d,h,m,s){
document.getElementById("days").textContent=d;
document.getElementById("hours").textContent=h;
document.getElementById("minutes").textContent=m;
document.getElementById("seconds").textContent=s;
}


function updateTimer(){

const light = document.getElementById("statusLight");
const label = document.getElementById("statusLabel");
const status = document.querySelector(".status");


if(!maintenanceActive){

    // Show online status
    status.style.display = "flex";

    light.className = "status-light inactive";
    label.textContent = "Online";
    label.style.color = "#61FE00";

    setTimer(0,0,0,0);

    return;

}


// Hide status during maintenance
status.style.display = "none";


const now = new Date();

const difference = now - startTime;

const totalSeconds = Math.floor(difference / 1000);


const days = Math.floor(totalSeconds / 86400);

const hours = Math.floor((totalSeconds % 86400) / 3600);

const minutes = Math.floor((totalSeconds % 3600) / 60);

const seconds = totalSeconds % 60;


setTimer(days,hours,minutes,seconds);

}


updateTimer();

setInterval(updateTimer,1000);


</script>
