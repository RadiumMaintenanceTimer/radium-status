<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Reset & Full Height Setup */
html, body { 
  margin: 0; 
  padding: 0;
  width: 100%; 
  min-height: 100vh; 
  overflow-x: hidden; 
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
  background: linear-gradient(to bottom, #100F15, #1A1325); 
}

* { 
  box-sizing: border-box; 
}

/* 
   BASE SCALE SWITCH: 
   Using 'vmin' instead of 'vw' ensures landscape mode 
   scales based on the short screen height instead of expanding!
*/
:root {
  --base-scale: 3.5vmin;
}

/* Flex Container */
.scale-wrapper {
  width: 100%;
  max-width: 600px;
  min-height: 100vh; 
  margin: 0 auto;
  padding: 3vmin 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Gradients */
.title, 
.timer, 
.discord, 
.footer { 
  background: linear-gradient(135deg, #61FE00, #019A43); 
  -webkit-background-clip: text; 
  background-clip: text; 
  -webkit-text-fill-color: transparent; 
  color: transparent; 
}

/* TOP: Logo */
.logo { 
  display: flex;
  justify-content: center;
}

.logo img { 
  width: calc(var(--base-scale) * 7); 
  max-width: 150px;
  height: auto; 
}

/* CENTER SECTION */
.center-content {
  margin: auto 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateY(-3%); 
}

/* Title */ 
.title { 
  width: 90%; 
  text-align: center; 
  line-height: 1.1; 
}

.small { 
  font-size: calc(var(--base-scale) * 1.2); 
  font-weight: 700; 
}

.large { 
  font-size: calc(var(--base-scale) * 2.8); 
  font-weight: 900; 
  letter-spacing: -1.5px; 
}

.medium { 
  font-size: calc(var(--base-scale) * 0.7); 
  font-weight: 800; 
}

/* Divider */
.divider { 
  margin: calc(var(--base-scale) * 0.8) auto calc(var(--base-scale) * 1.5) auto;
  width: 80%;
  max-width: 550px;
  height: 2px;
  border-radius: 10px;
  background: linear-gradient(135deg, #61FE00, #019A43);
}

/* Timer Section */ 
.timer { 
  width: 95%;
  display: flex;
  justify-content: space-evenly; 
  gap: calc(var(--base-scale) * 1.2); 
  text-align: center;
}

.time-box {
  min-width: calc(var(--base-scale) * 2.5); 
}

.number { 
  font-size: calc(var(--base-scale) * 2.2); 
  font-weight: 800; 
  line-height: 1;
}

.label { 
  margin-top: 4px; 
  font-size: calc(var(--base-scale) * 0.6); 
  font-weight: 700; 
  line-height: 1.2;
}

/* BOTTOM: Discord & Footer */ 
.discord { 
  margin-bottom: calc(var(--base-scale) * 0.6);
  text-align: center;
  font-size: calc(var(--base-scale) * 1.3);
  font-weight: 700;
}

.discord-logo { 
  width: calc(var(--base-scale) * 1.3); 
  height: auto; 
  vertical-align: middle; 
  margin-right: 6px; 
}

/* Footer */ 
.footer { 
  width: 90%;
  text-align: center;
  font-size: calc(var(--base-scale) * 0.45);
  font-weight: 700;
  line-height: 1.5;
}

/* Glowing text highlight */
.label, .small, .medium, .discord, .footer {
  text-shadow: 0 0 1px rgba(97, 254, 0, 0.3);
}

/* TIGHT LANDSCAPE TWEAKS (For phones turned horizontally) */
@media (max-height: 500px) and (orientation: landscape) {
  :root {
    --base-scale: 4.5vh; /* Purely scale off vertical height in landscape */
  }
  .center-content {
    transform: translateY(0); /* Remove offset to maximize vertical room */
  }
}

/* Desktop sizing limit */
@media (min-width: 800px) and (min-height: 700px) {
  :root {
    --base-scale: 24px;
  }
}
</style>
</head>

<body>

<div class="scale-wrapper">
  
  <div class="logo">
      <img src="BASE64_HERE" alt="Logo">
  </div>

  <div class="center-content">
    <div class="title">
        <div class="small">Time Since</div>
        <div class="large">Radium</div>
        <div class="medium">Went Down For Maintenance</div>
    </div>

    <div class="divider"></div>

    <div class="timer" id="timer">
        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>
        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>
        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">Mins</div>
        </div>
        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">Secs</div>
        </div>
    </div>
  </div>

  <div class="discord">
      <img src="BASE64_HERE" class="discord-logo" alt="Discord Logo">
      <a href="https://discord.gg/radium-rr" style="text-decoration: none; color: inherit;">Radium Discord</a>
  </div>

  <div class="footer">
      <div>Site created by <a href="https://discord.com/users/1112879692001841172" style="text-decoration: none; color: inherit;">@TapsDeveloper</a> on Discord!<br>ⓘ Disclaimer | @RadiumMaintenanceTimer is not affiliated with Radium. All rights reserved to Radium and its lovely developers.</div>
  </div>
  
</div>

<script>
const startTime = new Date("June 15, 2026 18:00:00");
function updateTimer() { 
  const now = new Date(); 
  const difference = now - startTime;
  const totalSeconds = Math.floor(difference / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent = hours;
  document.getElementById("minutes").textContent = minutes;
  document.getElementById("seconds").textContent = seconds;
}
updateTimer(); 
setInterval(updateTimer, 1000);
</script>

</body>
</html>
